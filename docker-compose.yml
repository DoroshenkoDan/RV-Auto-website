services:
  postgres:
    image: postgres:16-alpine
    container_name: rvauto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rvauto
      POSTGRES_PASSWORD: rvauto
      POSTGRES_DB: rvauto
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
